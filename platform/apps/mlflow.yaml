# Tracking server + model registry. Metadata in Postgres (CloudNativePG), artifacts in SeaweedFS.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/raven4ever/substack-k8s-mlops.git
      targetRevision: main
      path: platform/manifests/mlflow
    - repoURL: https://community-charts.github.io/helm-charts
      chart: mlflow
      targetRevision: 1.11.7
      helm:
        valuesObject:
          backendStore:
            databaseMigration: true
            databaseConnectionCheck: true
            postgres:
              enabled: true
              host: mlflow-db-rw
              port: 5432
              database: app
            existingDatabaseSecret:
              name: mlflow-db-app # generated by CloudNativePG
          artifactRoot:
            # Clients upload through MLflow, so they need no S3 credentials.
            proxiedArtifactStorage: true
            s3:
              enabled: true
              bucket: mlflow
              existingSecret:
                name: s3-credentials # created by bootstrap/install.sh
          extraEnvVars:
            MLFLOW_S3_ENDPOINT_URL: http://seaweedfs-all-in-one.seaweedfs:8333
          serverAllowedHosts:
            - mlflow.localhost:8080
            - mlflow.mlflow.svc.cluster.local:5000
            - mlflow.mlflow:5000
          corsAllowedOrigins:
            - http://mlflow.localhost:8080
          ingress:
            enabled: true
            className: traefik
            hosts:
              - host: mlflow.localhost
                paths:
                  - path: /
                    pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
    retry: # the database CRD appears once cloudnative-pg is synced
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
