# Kubeflow Pipelines standalone, straight from the upstream kustomize manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kfp-cluster-scoped
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubeflow/pipelines.git
    targetRevision: 2.17.2
    path: manifests/kustomize/cluster-scoped-resources
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kfp
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/kubeflow/pipelines.git
      targetRevision: 2.17.2
      path: manifests/kustomize/env/platform-agnostic
    - repoURL: https://github.com/raven4ever/substack-k8s-mlops.git
      targetRevision: main
      path: platform/manifests/kfp
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
    retry: # CRDs and namespace come from kfp-cluster-scoped
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
