# Model serving. Standard mode = plain Deployment + Ingress, no Knative or Istio.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/kserve/charts
      chart: kserve-crd
      targetRevision: v0.20.0
    - repoURL: ghcr.io/kserve/charts
      chart: kserve-resources
      targetRevision: v0.20.0
      helm:
        valuesObject:
          kserve:
            controller:
              deploymentMode: Standard
              gateway:
                domain: localhost # InferenceService URL: <name>-<namespace>.localhost:8080
                ingressGateway:
                  className: traefik
    - repoURL: ghcr.io/kserve/charts
      chart: kserve-runtime-configs
      targetRevision: v0.20.0
      helm:
        valuesObject:
          kserve:
            servingruntime:
              enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kserve
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: # webhook certificates need cert-manager
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 3m}
