# S3-compatible object store for MLflow artifacts and DVC data.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://seaweedfs.github.io/seaweedfs/helm
    chart: seaweedfs
    targetRevision: 4.47.0
    helm:
      valuesObject:
        # Single pod runs master, volume, filer and S3 gateway.
        master: {enabled: false}
        volume: {enabled: false}
        filer: {enabled: false}
        allInOne:
          enabled: true
          s3:
            enabled: true
            enableAuth: true
            existingConfigSecret: seaweedfs-s3-config # created by bootstrap/install.sh
            createBuckets:
              - name: mlflow
              - name: dvc
          data:
            type: persistentVolumeClaim
            size: 20Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: seaweedfs
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
