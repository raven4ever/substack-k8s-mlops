apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kfp-ui
spec:
  ingressClassName: traefik
  rules:
    - host: kfp.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ml-pipeline-ui
                port:
                  number: 80
