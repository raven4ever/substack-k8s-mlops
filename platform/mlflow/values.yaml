# Official MLflow chart. Metadata in Postgres (mlflow-db), artifacts in SeaweedFS.
image:
  tag: v3.16.1-full # chart 0.1.0 defaults to 3.14.0; -full adds boto3 and psycopg2
server:
  value_options:
    workers: 2
    allowed_hosts: mlflow.localhost:8080,mlflow.mlflow:5000,mlflow.mlflow.svc.cluster.local:5000
    cors_allowed_origins: http://mlflow.localhost:8080
mlflow:
  backendStoreUriFrom:
    secretKeyRef:
      name: mlflow-db-app # generated by CloudNativePG
      key: uri
  # Clients upload artifacts through MLflow, so they need no S3 credentials.
  artifactsDestination: s3://mlflow
env:
  - name: MLFLOW_S3_ENDPOINT_URL
    value: http://seaweedfs-all-in-one.seaweedfs:8333
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef: {name: s3-credentials, key: AWS_ACCESS_KEY_ID} # created by bootstrap/install.sh
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef: {name: s3-credentials, key: AWS_SECRET_ACCESS_KEY}
fullnameOverride: mlflow # service mlflow.mlflow:5000 instead of mlflow-mlflow
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: mlflow.localhost
      paths:
        - path: /
          pathType: Prefix
