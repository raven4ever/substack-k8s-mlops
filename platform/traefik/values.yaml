ports:
  # Unprivileged ports: no sudo on Linux, same URLs on every local cluster.
  web:
    exposedPort: 8080
  websecure:
    exposedPort: 8443
metrics:
  prometheus:
    # Request rate, status codes and latency per service, scraped by kube-prometheus-stack.
    service:
      enabled: true
    serviceMonitor:
      enabled: true
