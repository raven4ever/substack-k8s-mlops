# KServe pulls the model from SeaweedFS with the credentials of this account.
# The InferenceService itself is created and rolled by the pipeline's promote step, not by Argo CD:
# Git owns the platform, the model registry owns which model is the champion.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wine-model
secrets:
  - name: s3-credentials # created by bootstrap/install.sh
---
# Lets the pipeline (kubeflow/pipeline-runner) deploy the champion into this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-deployer
rules:
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-deployer
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: kubeflow
