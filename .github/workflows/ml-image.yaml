# Builds the ML image (pipeline components, drift monitor) and publishes it to GHCR,
# tagged with ml/VERSION. Bump ml/VERSION (and the CronJob image in apps/wine) to release.
name: ml-image
on:
  push:
    branches: [main]
    paths: [ml/**]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "tag=$(cat ml/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ml
          push: true
          tags: ghcr.io/${{ github.repository }}/ml:${{ steps.version.outputs.tag }}
